<!-- Animated dithering behind the banner: see _includes/dither.js. Change the look with data-ink (#rrggbb),
     data-shape (square, circle, triangle, diamond), data-pixel-size, data-density (roughly the share
     covered by dots, 0 to 1) and data-opacity (0 to 1). -->
<header class="banner" data-dither data-ink="#bcd5f0" data-shape="square" data-pixel-size="4" data-density="0.35" data-opacity="1">
  <!-- The dithering spans the whole window and runs behind the menu; the photo, text and menu links stay in the
       page's 800px column -->
  <div class="banner-content">
    <img src="https://scholar.googleusercontent.com/citations?view_op=medium_photo&user=jqy3zjgAAAAJ&citpid=3"
      alt="profile photo">
    <div>
      <p class="name">Joseph ALLYNDRÉE</p>
      <p class="contact">
        <a href="mailto:joseph.allyndree@inrae.fr">Email</a> &nbsp;/&nbsp;
        <a href="{{ '/data/Joseph_ALLYNDREE_CV.pdf' | relative_url }}">CV</a> &nbsp;/&nbsp;
        <a href="https://github.com/J-ally/">Github</a> &nbsp;/&nbsp;
        <a href="https://scholar.google.com/citations?user=jqy3zjgAAAAJ&hl=fr">Google Scholar</a> &nbsp;/&nbsp;
        <a href="https://hal.science/search/index/q/*/authIdHal_s/joseph-allyndree">HAL</a>
      </p>
    </div>
  </div>
  {% include nav.html %}
</header>
<script>
  // The banner is sticky with a negative top, so once the photo and name scroll away only the menu stays on
  // screen, still over the dithering. The offset is the height of the part above the menu, which changes
  // when the contact links wrap on small screens.
  (function () {
    const banner = document.querySelector('.banner');
    const content = banner.querySelector('.banner-content');
    new ResizeObserver(() => banner.style.setProperty('--banner-content-height', content.offsetHeight + 'px'))
      .observe(content);
  })();
</script>
<!-- The dithering script is written into every page right after the banner, rather than loaded as a separate file,
     so the dots are drawn before the page first shows: loaded separately, it ran only after the page had appeared,
     and the banner flashed white without its dots at each page change -->
<script>
{% include dither.js %}
</script>
