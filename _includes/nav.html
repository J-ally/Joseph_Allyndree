<!-- Menu entries come from _data/navigation.yml -->
<!-- Included inside the banner (_includes/banner.html) so the dithering runs behind the menu -->
<nav class="site-nav">
  <div class="site-nav-links">
    {%- for item in site.data.navigation %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
  </div>
</nav>
